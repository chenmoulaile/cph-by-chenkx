name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per commit: publishing a release pushes both the branch and the tag,
# which used to start two identical runs and email every failure twice. The
# cancelled duplicate is grey, not red.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.8'
          - os: ubuntu-latest
            python-version: '3.12'
          # memprobe / terminate / _needs_shell / taskkill are platform
          # branches, so they need real Windows and macOS runners too.
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      # checkout@v4 / setup-python@v5 target Node.js 20, which GitHub now forces
      # onto Node 24 and reports as a deprecation warning on every run.
      # The first majors that target Node 24 are v5 and v6.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python 3.3 host compatibility guard
        run: python tests/check_py33.py

      - name: Regression tests (no Sublime required)
        run: python tests/run_tests.py

      - name: Byte-compile every module
        run: python -m compileall -q .
