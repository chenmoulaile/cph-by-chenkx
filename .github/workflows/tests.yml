name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.8'
          - os: ubuntu-latest
            python-version: '3.12'
          # memprobe / terminate / _needs_shell / taskkill are platform
          # branches, so they need real Windows and macOS runners too.
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python 3.3 host compatibility guard
        run: python tests/check_py33.py

      - name: Regression tests (no Sublime required)
        run: python tests/run_tests.py

      - name: Byte-compile every module
        run: python -m compileall -q .
