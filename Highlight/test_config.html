<div class="panel">
	<a class="test {test_type}" href="test-click">
		<span class="verdict-badge {verdict_class}">{verdict_short}</span>
		{test_label} {test_id}
		<span class="testcase-stderr-indicator" style="display: {stderr_display};">{stderr_label}</span>
	</a>
	
	<a class="config" href="test-edit">
		{edit_label}
	</a>

	<a class="config config-run" href="test-run">
		{run_label}
	</a>

	<a class="config config-detail" href="test-detail">
		{detail_label}
	</a>

	<a class="config">
		<div style="display: inline; position: relative;">
			{time_label}:
		</div>
		<i class="runtime-info" style="padding: 1px; position: relative; font-style: normal">{runtime}</i>
	</a>
	<a class="config" style="display: {memory_display};">
		<div style="display: inline; position: relative;">
			{memory_label}:
		</div>
		<i class="memory-info" style="padding: 1px; position: relative; font-style: normal">{memory}</i>
	</a>
</div>
